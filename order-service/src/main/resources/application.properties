spring.application.name=order-service
server.port=8080

eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s

# H2: o lock pessimista segura a linha durante a chamada de pagamento (com retry),
# então as outras requisições precisam esperar mais que o padrão de 2s
spring.datasource.url=jdbc:h2:mem:orderdb;LOCK_TIMEOUT=60000
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.connection-timeout=60000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Spring AI: a chave vem de variável de ambiente, nunca do repositório
spring.ai.openai.api-key=${OPENAI_API_KEY:missing-key}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.model=gpt-4o-mini